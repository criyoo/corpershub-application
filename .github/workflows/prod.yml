name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: "eu-west-1"
  AWS_USE_PROFILE: "0"
  IMAGE_TAG: ${{ github.sha }}
  LINUX_PLATFORM: "arm64"
  PYTHON_VERSION: "3.12"

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: .
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: "${{ env.LINUX_PLATFORM }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}" 

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Check migrations
        run: |
          cd apps/api
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
      # - name: Run backend tests
      #   run: |
      #     cd apps/api
      #     python manage.py test --settings=config.settings.test


  deploy-api:
    needs: test-api
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}" 

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Check migrations
        run: |
          cd apps/api
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.LINUX_PLATFORM }}

      - name: Manual approval before apply
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: criyoo
          minimum-approvals: 1
          issue-title: "Approve api deployment"
          issue-body: "Please approve or deny api deployment to production."

      - name: Deploy API
        run: bash scripts/deploy/api.sh prod

      - name: Wait for API to be ready
        run: sleep 10


  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace apps/web

      - name: Typecheck frontend
        run: npm run typecheck --workspace apps/web

      - name: Test frontend
        run: npm run test --workspace apps/web

      - name: Build frontend
        run: npm run build --workspace apps/web

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Manual approval before apply
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: criyoo
          minimum-approvals: 1
          issue-title: "Approve api deployment"
          issue-body: "Please approve or deny api deployment to production."

      - name: Deploy Web
        run: bash scripts/deploy/web.sh prod
