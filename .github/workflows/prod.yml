name: Deploy Production

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: "eu-west-1"
  AWS_USE_PROFILE: "0"
  IMAGE_TAG: ${{ github.sha }}
  LINUX_PLATFORM: "arm64"
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.0"

jobs:
  detect-web-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      web: ${{ steps.resolve.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            web:
              - "web/**"
              - "packages/**"
              - "scripts/deploy/common.sh"
              - "scripts/deploy/web.sh"
              - "scripts/deploy/invalidate_web.sh"
              - "package.json"
              - "package-lock.json"
              - "turbo.json"
              - ".github/workflows/prod.yml"

      - name: Resolve web change flag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  lint-web:
    needs: detect-web-changes
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          node scripts/ensure-rollup-native.cjs web

      - name: Lint frontend
        run: npm run lint --workspace web

      - name: Typecheck frontend
        run: npm run typecheck --workspace web

  test-web:
    needs:
      - detect-web-changes
      - lint-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          node scripts/ensure-rollup-native.cjs web

      - name: Test frontend
        run: npm run test --workspace web

  build-web:
    needs:
      - detect-web-changes
      - test-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          node scripts/ensure-rollup-native.cjs web

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.corpershub.ng/api
          NEXT_PUBLIC_WS_URL: wss://api.corpershub.ng
          NEXT_PUBLIC_HOME_BACKGROUNDS_MANIFEST_URL: https://api.corpershub.ng/api/home-backgrounds/
        run: npm run build --workspace web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/out
          retention-days: 1
          include-hidden-files: true

  deploy-web:
    needs:
      - detect-web-changes
      - build-web
    if: needs.detect-web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/out

      - name: Verify web build artifact
        run: test -f web/out/index.html

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Web
        run: INSTALL_DEPS=0 BUILD_WEB=0 bash scripts/deploy/web.sh prod

        
  detect-api-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      api: ${{ steps.resolve.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - "api/**"
              - "worker/**"
              - "scripts/deploy/common.sh"
              - "scripts/deploy/api.sh"
              - "scripts/migrate.sh"
              - ".github/workflows/prod.yml"

      - name: Resolve api change flag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  lint-api:
    needs: detect-api-changes
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Check migrations
        run: |
          source .venv/bin/activate
          cd api
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Lint backend
        run: |
          source .venv/bin/activate
          cd api
          ruff format .
          ruff check .

  test-api:
    needs:
      - detect-api-changes
      - lint-api
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run backend tests
        run: |
          source .venv/bin/activate
          cd api
          python manage.py test --settings=config.settings.test

  deploy-api:
    needs:
      - detect-api-changes
      - test-api
    if: needs.detect-api-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.LINUX_PLATFORM }}

      - name: Debug role ARN
        run: echo "${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API
        run: bash scripts/deploy/api.sh prod
